<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBMA Web Trading</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Top Bar */
        .topbar { background: #161b22; padding: 10px 16px; display: flex; gap: 16px; border-bottom: 1px solid #30363d; align-items: center; flex-shrink: 0; z-index: 20; }
        .brand { color: #58a6ff; font-weight: 800; font-size: 18px; }
        .status-text { color: #26a69a; font-size: 12px; }
        .controls { display: flex; gap: 8px; margin-left: auto; }
        .btn { background: transparent; color: #8b949e; border: 1px solid #30363d; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
        .btn:hover { background: #30363d; }
        .btn.active { background: #1f6feb; color: white; border-color: #1f6feb; }
        
        /* Chart Area */
        #chart { position: absolute; top: 50px; bottom: 0; left: 0; right: 0; }
        
        /* Robot Panel */
        .robot-panel { position: absolute; bottom: 20px; left: 20px; width: 320px; background: rgba(22, 27, 34, 0.95); border: 1px solid #30363d; border-radius: 12px; padding: 16px; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .robot-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .robot-title { font-size: 12px; font-weight: 600; }
        .robot-subtitle { font-size: 10px; color: #8b949e; }
        .robot-dir { font-size: 26px; font-weight: 800; color: #d29922; margin-bottom: 4px; }
        .robot-mtf { font-size: 11px; color: #58a6ff; margin-bottom: 12px; }
        
        /* Levels */
        .levels { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 12px; }
        .lvl-box { background: #0d1117; border-radius: 6px; padding: 6px; }
        .lvl-lbl { font-size: 9px; color: #6e7681; }
        .lvl-val { font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">BBMA Web</div>
        <div class="status-text" id="status">Status: Menunggu sambungan...</div>
        
        <div class="controls">
            <select id="symbol-select" class="btn" style="background:#0d1117; color:white;">
                <option value="XAUUSD">XAUUSD (Gold)</option>
                <option value="EURUSD">EURUSD</option>
                <option value="GBPUSD">GBPUSD</option>
                <option value="BTCUSD">BTCUSD</option>
            </select>
            <button class="btn tf-btn" onclick="changeTF(this, 60)">1m</button>
            <button class="btn tf-btn" onclick="changeTF(this, 300)">5m</button>
            <button class="btn tf-btn active" onclick="changeTF(this, 900)">15m</button>
            <button class="btn tf-btn" onclick="changeTF(this, 3600)">1h</button>
        </div>
    </div>

    <div id="chart"></div>

    <div class="robot-panel">
        <div class="robot-header">
            <div>
                <div class="robot-title">AI SIGNAL ROBOT</div>
                <div class="robot-subtitle">BBMA Multi-Timeframe Engine</div>
            </div>
        </div>
        <div class="robot-mtf" id="robot-mtf">HTF: - | LTF: -</div>
        <div class="robot-dir" id="robot-dir">WAIT</div>
        
        <div class="levels" id="levels-box">
            <div class="lvl-box">
                <div class="lvl-lbl">ENTRY</div>
                <div class="lvl-val" id="lvl-entry" style="color: #8b949e;">—</div>
            </div>
            <div class="lvl-box">
                <div class="lvl-lbl">TARGET</div>
                <div class="lvl-val" id="lvl-target" style="color: #26a69a;">—</div>
            </div>
            <div class="lvl-box">
                <div class="lvl-lbl">STOP</div>
                <div class="lvl-val" id="lvl-stop" style="color: #ef5350;">—</div>
            </div>
        </div>
    </div>

    <script>
        const chartContainer = document.getElementById('chart');
        let chart = LightweightCharts.createChart(chartContainer, {
            layout: { background: { type: 'solid', color: '#0d1117' }, textColor: '#c9d1d9' },
            grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
            timeScale: { timeVisible: true },
            rightPriceScale: { borderColor: '#30363d' },
        });

        // 1. Setup Series (Candlestick & Indikator BBMA)
        let candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
            upColor: '#26a69a', downColor: '#ef5350',
            borderUpColor: '#26a69a', borderDownColor: '#ef5350',
            wickUpColor: '#26a69a', wickDownColor: '#ef5350'
        });

        const seriesOpts = { lineWidth: 2 };
        const bbOpts = { lineWidth: 1, lineStyle: 2 }; // 2 = Dashed

        let bbUpper = chart.addSeries(LightweightCharts.LineSeries, { color: '#bfbfbf', ...bbOpts });
        let bbMiddle = chart.addSeries(LightweightCharts.LineSeries, { color: '#bfbfbf', ...bbOpts });
        let bbLower = chart.addSeries(LightweightCharts.LineSeries, { color: '#bfbfbf', ...bbOpts });
        
        let ma5High = chart.addSeries(LightweightCharts.LineSeries, { color: '#ff009d', ...seriesOpts });
        let ma10High = chart.addSeries(LightweightCharts.LineSeries, { color: '#ff0008', ...seriesOpts });
        let ma5Low = chart.addSeries(LightweightCharts.LineSeries, { color: '#00a2ff', ...seriesOpts });
        let ma10Low = chart.addSeries(LightweightCharts.LineSeries, { color: '#006eff', ...seriesOpts });
        let ma50 = chart.addSeries(LightweightCharts.LineSeries, { color: '#00ff00', ...seriesOpts });

        // Resize Observer
        const resizeObserver = new ResizeObserver(entries => {
            if (entries.length === 0) return;
            const newRect = entries[0].contentRect;
            chart.applyOptions({ height: newRect.height, width: newRect.width });
        });
        resizeObserver.observe(chartContainer);

        // 2. WebSocket & State
        let ws;
        let currentSymbol = "XAUUSD";
        let currentTF = 900;

        function connectWS() {
            const statusEl = document.getElementById('status');
            const wsUrl = "wss://bbma-cloud-backend.onrender.com/ws/chart";
            
            statusEl.innerText = `Status: Menghubungi server...`;
            statusEl.style.color = "#d29922";
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusEl.innerText = "Status: ✅ Live!";
                statusEl.style.color = "#26a69a";
                // Hantar arahan awal (Symbol & TF)
                ws.send(JSON.stringify({ action: "change", symbol: currentSymbol, tf: currentTF }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "update") {
                    // A. Lukis Candlestick
                    candleSeries.setData(data.bars);

                    // B. Lukis Indikator (Tukar Array kosong kepada format Chart)
                    const formatLine = (arr) => data.bars.map((b, i) => arr[i] !== null ? { time: b.time, value: arr[i] } : null).filter(x => x);
                    
                    bbUpper.setData(formatLine(data.bb_upper));
                    bbMiddle.setData(formatLine(data.bb_middle));
                    bbLower.setData(formatLine(data.bb_lower));
                    ma5High.setData(formatLine(data.ma5_high));
                    ma10High.setData(formatLine(data.ma10_high));
                    ma5Low.setData(formatLine(data.ma5_low));
                    ma10Low.setData(formatLine(data.ma10_low));
                    ma50.setData(formatLine(data.ma50));

                    // C. Update Robot
                    const v = data.verdict;
                    const dirEl = document.getElementById('robot-dir');
                    dirEl.innerText = v.direction;
                    
                    let color = '#d29922';
                    if (v.direction === 'BUY') color = '#26a69a';
                    if (v.direction === 'SELL') color = '#ef5350';
                    dirEl.style.color = color;

                    document.getElementById('robot-mtf').innerText = `HTF: ${v.trend} | LTF: ${v.phase}`;

                    if (v.direction !== 'WAIT' && v.entry) {
                        document.getElementById('levels-box').style.display = 'grid';
                        document.getElementById('lvl-entry').innerText = v.entry.toFixed(5);
                        document.getElementById('lvl-target').innerText = v.target.toFixed(5);
                        document.getElementById('lvl-stop').innerText = v.stop.toFixed(5);
                    } else {
                        document.getElementById('levels-box').style.display = 'none';
                    }
                }
            };

            ws.onclose = () => {
                statusEl.innerText = "Status: ❌ Terputus. Cuba lagi...";
                statusEl.style.color = "#ef5350";
                setTimeout(connectWS, 3000);
            };
        }

        // 3. Fungsi Butang
        document.getElementById('symbol-select').addEventListener('change', (e) => {
            currentSymbol = e.target.value;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: "change", symbol: currentSymbol, tf: currentTF }));
            }
        });

        function changeTF(btn, tf) {
            currentTF = tf;
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: "change", symbol: currentSymbol, tf: currentTF }));
            }
        }

        // Mula
        connectWS();
    </script>
</body>
</html>
