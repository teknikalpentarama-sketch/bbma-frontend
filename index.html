<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBMA Web Trading</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>

         /* Badge untuk Status Data */
        .badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-left: 10px;
        }
        .badge.live {
            background: rgba(38, 166, 154, 0.15);
            color: #26a69a;
            border: 1px solid #26a69a;
        }
        .badge.sim {
            background: rgba(210, 153, 34, 0.15);
            color: #d29922;
            border: 1px solid #d29922;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Top Bar */
        .topbar { background: #161b22; padding: 10px 16px; display: flex; gap: 16px; border-bottom: 1px solid #30363d; align-items: center; flex-shrink: 0; z-index: 20; }
        .brand { color: #58a6ff; font-weight: 800; font-size: 18px; }
        .status-text { color: #26a69a; font-size: 12px; }
        .controls { display: flex; gap: 8px; margin-left: auto; }
        .btn { background: transparent; color: #8b949e; border: 1px solid #30363d; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
        .btn:hover { background: #30363d; }
        .btn.active { background: #1f6feb; color: white; border-color: #1f6feb; }
        
        /* Chart Area */
        #chart { position: absolute; top: 50px; bottom: 0; left: 0; right: 0; }
        
        /* Robot Panel (UI UPGRADE) */
        .robot-panel { 
            position: absolute; bottom: 24px; left: 24px; width: 340px; 
            background: rgba(22, 27, 34, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid #30363d; border-radius: 16px; padding: 20px; z-index: 10; 
            box-shadow: 0 12px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05) inset; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .robot-panel.buy { border-color: #26a69a; box-shadow: 0 0 20px rgba(38, 166, 154, 0.2), 0 12px 32px rgba(0,0,0,0.6); }
        .robot-panel.sell { border-color: #ef5350; box-shadow: 0 0 20px rgba(239, 83, 80, 0.2), 0 12px 32px rgba(0,0,0,0.6); }
        
        .robot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .robot-title { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
        .robot-subtitle { font-size: 10px; color: #8b949e; }
        .btn-minimize { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 16px; transition: color 0.2s; }
        .btn-minimize:hover { color: #c9d1d9; }
        
        .robot-body { transition: max-height 0.4s ease, opacity 0.4s ease; overflow: hidden; max-height: 400px; }
        .robot-body.collapsed { max-height: 0; opacity: 0; }

        .robot-mtf { font-size: 11px; color: #58a6ff; margin-bottom: 12px; background: rgba(88, 166, 255, 0.1); padding: 6px 10px; border-radius: 6px; display: inline-block; }
        
        .robot-dir-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
        .robot-dir { font-size: 32px; font-weight: 800; color: #d29922; letter-spacing: 1px; }
        .robot-conv { font-size: 13px; color: #8b949e; }
        
        /* Confidence Bar */
        .conf-bar-bg { height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
        .conf-bar-fill { height: 100%; width: 0%; background: #d29922; transition: width 0.4s ease, background-color 0.4s ease; }
        
        /* Levels */
        .levels { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .lvl-box { background: rgba(13, 17, 23, 0.6); border: 1px solid #21262d; border-radius: 8px; padding: 8px; text-align: center; }
        .lvl-lbl { font-size: 9px; color: #6e7681; letter-spacing: 1px; margin-bottom: 4px; }
        .lvl-val { font-size: 13px; font-weight: 600; }
        
        /* Reasons list */
        .reasons { font-size: 11px; color: #8b949e; line-height: 1.6; border-top: 1px solid #30363d; padding-top: 12px; margin-top: 8px; }
        .reasons div { margin-bottom: 4px; display: flex; gap: 6px; }
        .reasons span { color: #58a6ff; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">BBMA Web</div>
        <div class="status-text" id="status">Status: Menunggu sambungan...</div>

        <!-- TAMBAH BADGE DI SINI -->
        <div id="data-badge" class="badge sim">SIMULASI</div> 
        
        <div class="controls">
            <!-- ... (butang controls kekal sama) ... -->
        
        <div class="controls">
            <select id="symbol-select" class="btn" style="background:#0d1117; color:white;">
                <option value="XAUUSD">XAUUSD (Gold)</option>
                <option value="EURUSD">EURUSD</option>
                <option value="GBPUSD">GBPUSD</option>
                <option value="BTCUSD">BTCUSD</option>
            </select>
            <button class="btn tf-btn" onclick="changeTF(this, 60)">1m</button>
            <button class="btn tf-btn" onclick="changeTF(this, 300)">5m</button>
            <button class="btn tf-btn active" onclick="changeTF(this, 900)">15m</button>
            <button class="btn tf-btn" onclick="changeTF(this, 3600)">1h</button>
            <button class="btn" onclick="resetView()" style="color: #d29922; border-color: #d29922;">RESET</button>
        </div>
    </div>

    <div id="chart"></div>

    <div class="robot-panel" id="robot-panel">
        <div class="robot-header">
            <div>
                <div class="robot-title">AI SIGNAL ROBOT</div>
                <div class="robot-subtitle">BBMA MTF Engine (Oma Ally)</div>
            </div>
            <button class="btn-minimize" onclick="toggleRobot()">▼</button>
        </div>
        <div class="robot-body" id="robot-body">
            <div class="robot-mtf" id="robot-mtf">HTF: - | MTF: - | LTF: -</div>
            
            <div class="robot-dir-row">
                <div class="robot-dir" id="robot-dir">WAIT</div>
                <div class="robot-conv" id="robot-conv">0% conviction</div>
            </div>
            
            <div class="conf-bar-bg">
                <div class="conf-bar-fill" id="conf-bar"></div>
            </div>
            
            <div class="levels" id="levels-box">
                <div class="lvl-box">
                    <div class="lvl-lbl">ENTRY</div>
                    <div class="lvl-val" id="lvl-entry" style="color: #8b949e;">—</div>
                </div>
                <div class="lvl-box">
                    <div class="lvl-lbl">TARGET</div>
                    <div class="lvl-val" id="lvl-target" style="color: #26a69a;">—</div>
                </div>
                <div class="lvl-box">
                    <div class="lvl-lbl">STOP</div>
                    <div class="lvl-val" id="lvl-stop" style="color: #ef5350;">—</div>
                </div>
            </div>
            <div class="reasons" id="reasons-box"></div>
        </div>
    </div>

    <script>
        const chartContainer = document.getElementById('chart');
        let chart = LightweightCharts.createChart(chartContainer, {
            layout: { background: { type: 'solid', color: '#0d1117' }, textColor: '#c9d1d9' },
            grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
            timeScale: { timeVisible: true }, rightPriceScale: { borderColor: '#30363d' },
        });

        let candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, { upColor: '#26a69a', downColor: '#ef5350', borderUpColor: '#26a69a', borderDownColor: '#ef5350', wickUpColor: '#26a69a', wickDownColor: '#ef5350' });
        let bbUpper = chart.addSeries(LightweightCharts.LineSeries, { color: '#bfbfbf', lineWidth: 1, lineStyle: 2 });
        let bbMiddle = chart.addSeries(LightweightCharts.LineSeries, { color: '#bfbfbf', lineWidth: 1, lineStyle: 2 });
        let bbLower = chart.addSeries(LightweightCharts.LineSeries, { color: '#bfbfbf', lineWidth: 1, lineStyle: 2 });
        let ma5High = chart.addSeries(LightweightCharts.LineSeries, { color: '#ff009d', lineWidth: 2 });
        let ma10High = chart.addSeries(LightweightCharts.LineSeries, { color: '#ff0008', lineWidth: 2 });
        let ma5Low = chart.addSeries(LightweightCharts.LineSeries, { color: '#00a2ff', lineWidth: 2 });
        let ma10Low = chart.addSeries(LightweightCharts.LineSeries, { color: '#006eff', lineWidth: 2 });
        let ma50 = chart.addSeries(LightweightCharts.LineSeries, { color: '#00ff00', lineWidth: 2 });

        const resizeObserver = new ResizeObserver(entries => {
            if (entries.length === 0) return;
            chart.applyOptions({ height: entries[0].contentRect.height, width: entries[0].contentRect.width });
        });
        resizeObserver.observe(chartContainer);

        let ws; let currentSymbol = "XAUUSD"; let currentTF = 900;
        let isMinimized = false;

        function toggleRobot() {
            isMinimized = !isMinimized;
            const body = document.getElementById('robot-body');
            const btn = document.querySelector('.btn-minimize');
            if (isMinimized) { body.classList.add('collapsed'); btn.innerText = "▲"; } 
            else { body.classList.remove('collapsed'); btn.innerText = "▼"; }
        }

        function resetView() {
            const totalBars = candleSeries.data().length;
            if (totalBars > 0) {
                chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, totalBars - 150), to: totalBars + 5 });
                chart.timeScale().scrollToRealTime();
            }
        }

        function connectWS() {
            const statusEl = document.getElementById('status');
            const wsUrl = "wss://bbma-cloud-backend.onrender.com/ws/chart";
            statusEl.innerText = `Status: Menghubungi server...`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusEl.innerText = "Status: ✅ Live!";
                statusEl.style.color = "#26a69a";
                ws.send(JSON.stringify({ action: "change", symbol: currentSymbol, tf: currentTF }));
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "update") {
                        candleSeries.setData(data.bars);

                        // --- KEMAS KINI BADGE LIVE/SIMULASI ---
                        const badge = document.getElementById('data-badge');
                        if (data.is_live) {
                            badge.innerText = "LIVE DATA";
                            badge.className = "badge live";
                        } else {
                            badge.innerText = "SIMULASI";
                            badge.className = "badge sim";
                        }
                        // -------------------------------------

                        candleSeries.setData(data.bars);
                        
                        const formatLine = (arr) => data.bars.map((b, i) => arr[i] !== null ? { time: b.time, value: arr[i] } : null).filter(x => x);
                        bbUpper.setData(formatLine(data.bb_upper)); bbMiddle.setData(formatLine(data.bb_middle)); bbLower.setData(formatLine(data.bb_lower));
                        ma5High.setData(formatLine(data.ma5_high)); ma10High.setData(formatLine(data.ma10_high));
                        ma5Low.setData(formatLine(data.ma5_low)); ma10Low.setData(formatLine(data.ma10_low)); ma50.setData(formatLine(data.ma50));

                        const v = data.verdict;
                        const panel = document.getElementById('robot-panel');
                        const dirEl = document.getElementById('robot-dir');
                        const convEl = document.getElementById('robot-conv');
                        const confBar = document.getElementById('conf-bar');
                        
                        panel.classList.remove('buy', 'sell');
                        dirEl.innerText = v.direction;
                        convEl.innerText = `${v.conviction}% conviction`;
                        confBar.style.width = `${v.conviction}%`;
                        
                        let color = '#d29922';
                        if (v.direction === 'BUY') { color = '#26a69a'; panel.classList.add('buy'); }
                        if (v.direction === 'SELL') { color = '#ef5350'; panel.classList.add('sell'); }
                        dirEl.style.color = color;
                        confBar.style.backgroundColor = color;

                        document.getElementById('robot-mtf').innerText = `${v.trend} (${v.phase})`;
                        
                        if (v.direction !== 'WAIT' && v.entry) {
                            document.getElementById('levels-box').style.display = 'grid';
                            document.getElementById('lvl-entry').innerText = v.entry.toFixed(5);
                            document.getElementById('lvl-target').innerText = v.target.toFixed(5);
                            document.getElementById('lvl-stop').innerText = v.stop.toFixed(5);
                        } else {
                            document.getElementById('levels-box').style.display = 'none';
                        }
                        
                        if (v.reasons) {
                            document.getElementById('reasons-box').innerHTML = v.reasons.map(r => `<div><span>›</span> ${r}</div>`).join('');
                        }
                    }
                } catch (err) {
                    console.error("❌ Ralat memproses data:", err);
                }
            };

            ws.onclose = () => { statusEl.innerText = "Status: ❌ Terputus. Cuba lagi..."; statusEl.style.color = "#ef5350"; setTimeout(connectWS, 3000); };
        }

        document.getElementById('symbol-select').addEventListener('change', (e) => {
            currentSymbol = e.target.value;
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: "change", symbol: currentSymbol, tf: currentTF }));
        });

        function changeTF(btn, tf) {
            currentTF = tf;
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: "change", symbol: currentSymbol, tf: currentTF }));
        }

        connectWS();
    </script>
</body>
</html>
